[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "discovery-now"
version = "0.1.0"
description = "Discover, inventory and monitor the devices on your own network."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "TrueScaleTech" }]
keywords = ["network", "discovery", "inventory", "monitoring", "arp", "homelab"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.29",
    "rich>=13.7",
    "psutil>=5.9",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
# The desktop app. Widgets only, which keeps the install far smaller than "PySide6".
gui = ["PySide6-Essentials>=6.7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
discoverynow = "discovery_now.cli:main"

[project.urls]
Homepage = "https://github.com/TrueScaleTech/discovery-local-devices"
Issues = "https://github.com/TrueScaleTech/discovery-local-devices/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/discovery_now"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "S"]
ignore = [
    "S603", # subprocess call: every call site builds its own argument list, never a shell string
    "S607", # partial executable path: ping/ip/arp are resolved through PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # assert is how pytest works

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["psutil"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
